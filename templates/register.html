{% extends "base.html" %}
{% block title %}Criar conta – Vacinei{% endblock %}
{% block content %}
<h1>Criar conta</h1>
<form method="post" class="form-narrow">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="field">
    <label for="name">Nome</label>
    <input type="text" id="name" name="name" value="{{ form.get('name', '') }}" autocomplete="name" maxlength="80" required autofocus>
  </div>
  <div class="field">
    <label for="email">E-mail</label>
    <input type="email" id="email" name="email" value="{{ form.get('email', '') }}" autocomplete="email" maxlength="120" required>
  </div>
  <div class="field">
    <label for="password">Senha</label>
    <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required aria-describedby="pw-hint">
    <p class="hint" id="pw-hint">Pelo menos 8 caracteres.</p>
  </div>
  <div class="field">
    <label for="password2">Repita a senha</label>
    <input type="password" id="password2" name="password2" autocomplete="new-password" minlength="8" required>
  </div>
  <div class="field">
    <label class="check" for="consent">
      <input type="checkbox" id="consent" name="consent" required {{ 'checked' if form.get('consent') }}>
      <span>Concordo com o tratamento dos meus dados de saúde para montar o meu histórico vacinal, conforme a <a href="{{ url_for('privacy') }}">política de privacidade</a>.</span>
    </label>
  </div>
  <div class="btn-row">
    <button class="btn" type="submit">Criar conta</button>
    <a href="{{ url_for('login') }}">Já tenho conta</a>
  </div>
</form>
{% endblock %}
